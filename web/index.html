<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast HD Downloader</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101827;color:#f2f5fb}
body{margin:0;padding:24px}main{max-width:620px;margin:5vh auto;background:#1d293b;border:1px solid #34455d;border-radius:18px;padding:26px}
h1{margin:0 0 8px}p{color:#b7c5d9}label{display:block;margin:16px 0 6px}
input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #50617a;background:#111c2d;color:white;font:inherit}
button{background:#3275df;border:0;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.55;cursor:wait}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}progress{width:100%;height:18px;margin-top:20px}
#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#aab9ca}
@media(max-width:440px){body{padding:10px}main{padding:18px;margin:12px auto}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Fast HD Downloader</h1><p>Local dashboard · Download media you own or have permission to save</p>
<form id="form"><label for="url">YouTube URL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required maxlength="2048">
<div class="grid"><div><label for="format">Media format</label><select id="format"><option value="mp4">MP4 video</option><option value="mkv">MKV video</option><option value="mp3">MP3 audio</option><option value="m4a">M4A audio</option></select></div>
<div><label for="quality">Maximum resolution</label><select id="quality"><option value="best">Best available</option><option value="2160">4K</option><option value="1440">1440p</option><option value="1080" selected>1080p</option><option value="720">720p</option><option value="480">480p</option></select></div></div>
<button id="inspect" type="button">Check available resolutions</button>
<button id="submit" type="submit">Start download</button></form>
<progress id="progress" value="0" max="100"></progress><p id="status" role="status" aria-live="polite">Ready</p>
<small>Files save to your computer's Downloads/FastHDDownloader folder. This server is accessible only on this computer.</small>
</main><script>
const form=document.querySelector("#form"),btn=document.querySelector("#submit"),status=document.querySelector("#status"),progress=document.querySelector("#progress"),format=document.querySelector("#format"),quality=document.querySelector("#quality");
format.addEventListener("change",()=>{quality.disabled=["mp3","m4a"].includes(format.value)});
document.querySelector("#inspect").addEventListener("click",async ()=>{
const inspect=document.querySelector("#inspect");
if(!form.reportValidity())return;
inspect.disabled=true;btn.disabled=true;status.textContent="Checking available formats...";
try{
const res=await fetch("/api/formats",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:document.querySelector("#url").value})});
const data=await res.json();if(!res.ok)throw Error(data.detail||"Check failed");
status.textContent="Available resolutions: "+(data.resolutions.map(x=>x+"p").join(", ")||"No video resolutions reported")+(data.deno_available?"":" · Portable Deno not detected");
}catch(err){status.textContent=String(err)}finally{inspect.disabled=false;btn.disabled=false}
});
form.addEventListener("submit",async e=>{
e.preventDefault();btn.disabled=true;progress.value=0;status.textContent="Starting...";
try{
const response=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:document.querySelector("#url").value,format:format.value,quality:quality.value})});
const data=await response.json();if(!response.ok)throw Error(data.detail||"Request failed");
const poll=async()=>{
try{
const res=await fetch("/api/jobs/"+encodeURIComponent(data.id));if(!res.ok)throw Error("Status unavailable");
const job=await res.json();progress.value=job.percent||0;
status.textContent=job.status+" — "+(job.percent||0)+"%"+(job.speed?" · "+(job.speed/1048576).toFixed(2)+" MiB/s":"")+(job.eta!=null?" · ETA "+job.eta+"s":"")+(job.error?" · "+job.error:"");
if(job.status==="completed"||job.status==="failed"){btn.disabled=false;return}
setTimeout(poll,750)
}catch(err){status.textContent=String(err);btn.disabled=false}
};poll()
}catch(err){status.textContent=String(err);btn.disabled=false}
});
</script></body></html>

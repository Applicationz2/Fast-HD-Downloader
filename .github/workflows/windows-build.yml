name: Build Windows Portable ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-time dependencies on GitHub runner
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pyinstaller
          choco install ffmpeg aria2 -y --no-progress
      - name: Build desktop and portable CLI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name FastHDDownloader app.py
          pyinstaller --noconfirm --clean --onedir --console --name fastdl --collect-all uvicorn --collect-all fastapi --collect-all yt_dlp --add-data "web;web" fastdl.py
          New-Item -ItemType Directory -Force -Path dist/fastdl/bin | Out-Null
          $ff = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter ffprobe.exe | Select-Object -First 1
          $aria = Get-ChildItem 'C:\ProgramData\chocolatey\lib\aria2' -Recurse -Filter aria2c.exe | Select-Object -First 1
          if (-not $ff -or -not $fp -or -not $aria) { throw 'Required media binaries were not found' }
          Copy-Item $ff.FullName dist/fastdl/bin/ffmpeg.exe
          Copy-Item $fp.FullName dist/fastdl/bin/ffprobe.exe
          Copy-Item $aria.FullName dist/fastdl/bin/aria2c.exe
          @'
          Fast HD Downloader — portable Windows package

          Open FastHDDownloader/FastHDDownloader.exe for the desktop application.
          Open fastdl/fastdl.exe for the local browser dashboard.
          In PowerShell from the extracted folder: .\fastdl\fastdl.exe --audio "YOUR_URL"

          No Python installation is required. Keep the extracted folders intact.
          The dashboard listens only on 127.0.0.1 and is not accessible on mobile yet.
          Files save under Downloads/FastHDDownloader.
          Only download media you are authorized to save.
          '@ | Set-Content -Encoding UTF8 dist/START-HERE.txt
      - name: Smoke test portable CLI
        shell: pwsh
        run: |
          $output = & dist/fastdl/fastdl.exe --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed: $output" }
          $output | Select-Object -First 6
      - name: Assemble ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/FastHDDownloader,dist/fastdl,dist/START-HERE.txt -DestinationPath Fast-HD-Downloader-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fast-HD-Downloader-Windows-Portable
          path: Fast-HD-Downloader-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
